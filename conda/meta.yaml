{% set version = "1.0.0" %}

package:
  name: mkgraticule-planet
  version: {{ version }}

source:
  url: https://github.com/ryodohemmi/mkgraticule_planet/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a7c72d05d1bc3b6deabd42af06f43115fcc1c252405fb55fa1009e5c0cdd90cb

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mkgraticule_planet = mkgraticule_planet._cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68.0
  run:
    - python >=3.9
    - numpy
    - gdal

test:
  imports:
    - mkgraticule_planet
  commands:
    - mkgraticule_planet --version
    - mkgraticule_planet --help

about:
  home: https://github.com/ryodohemmi/mkgraticule_planet
  summary: Create planetary-scale graticules with multi-format labels for any GDAL/PROJ-supported CRS — exported as GeoPackage or SpatiaLite
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ryodohemmi
