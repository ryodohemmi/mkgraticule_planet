{% set version = "1.1.0" %}

package:
  name: mkgraticule-planet
  version: {{ version }}

source:
  url: https://github.com/ryodohemmi/mkgraticule_planet/archive/refs/tags/v{{ version }}.tar.gz
  # Add sha256 after the v{{ version }} GitHub release tarball is published.

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - mkgraticule = mkgraticule_planet._cli:main
    - mkgraticule_planet = mkgraticule_planet._cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68.0
  run:
    - python >=3.9
    - numpy
    - gdal
    - trimesh
    - rtree

test:
  imports:
    - mkgraticule_planet
  commands:
    - mkgraticule --version
    - mkgraticule --help
    - mkgraticule_planet --version
    - mkgraticule_planet --help

about:
  home: https://github.com/ryodohemmi/mkgraticule_planet
  summary: Create planetary-scale graticules with multi-format labels for any GDAL/PROJ-supported CRS — exported as GeoPackage, SpatiaLite, or fitted 3D PLY
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ryodohemmi
