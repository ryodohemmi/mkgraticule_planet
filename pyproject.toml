[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mkgraticule_planet"
version = "0.5.0"
description = "Create planetary graticules for IAU coordinate systems and export as GeoPackage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Ryodo Hemmi" },
]
keywords = [
    "planetary cartography",
    "graticule",
    "IAU coordinate systems",
    "GeoPackage",
    "GDAL",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "GDAL",
]

[project.urls]
Homepage = "https://github.com/ryodohemmi/mkgraticule_planet"
Repository = "https://github.com/ryodohemmi/mkgraticule_planet"
Changelog = "https://github.com/ryodohemmi/mkgraticule_planet/blob/main/CHANGELOG.md"

[project.scripts]
mkgraticule_planet = "mkgraticule_planet._cli:main"

[tool.setuptools.packages.find]
where = ["src"]
